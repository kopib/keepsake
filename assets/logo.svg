<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="keepsake logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="playGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Rounded slate emblem -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5"/>

  <!-- 3x3 Photomosaic grid tiles -->
  <!-- Row 1 -->
  <rect x="20" y="20" width="25" height="25" rx="6" fill="#0284c7" opacity="0.90"/>
  <rect x="51" y="20" width="25" height="25" rx="6" fill="#38bdf8" opacity="0.88"/>
  <!-- Top-right tile slightly lifted like a puzzle piece snapping into place -->
  <g transform="translate(3, -3) rotate(6 94 32)">
    <rect x="82" y="20" width="25" height="25" rx="6" fill="#fbbf24" opacity="0.96"/>
  </g>

  <!-- Row 2 -->
  <rect x="20" y="51" width="25" height="25" rx="6" fill="#14b8a6" opacity="0.88"/>
  <rect x="51" y="51" width="25" height="25" rx="6" fill="#f59e0b" opacity="0.92"/>
  <rect x="82" y="51" width="25" height="25" rx="6" fill="#fb7185" opacity="0.90"/>

  <!-- Row 3 -->
  <rect x="20" y="82" width="25" height="25" rx="6" fill="#1e3a8a" opacity="0.92"/>
  <rect x="51" y="82" width="25" height="25" rx="6" fill="#f97316" opacity="0.90"/>
  <rect x="82" y="82" width="25" height="25" rx="6" fill="#e11d48" opacity="0.86"/>

  <!-- Soft center vignette behind play emblem -->
  <circle cx="64" cy="64" r="24" fill="#0f172a" opacity="0.62"/>

  <!-- Clean rounded play triangle (video + music sync) -->
  <path d="M56.5 51.5 C56.5 49.4 58.8 48.1 60.6 49.2 L78.2 60.2 C79.9 61.2 79.9 63.8 78.2 64.8 L60.6 75.8 C58.8 76.9 56.5 75.6 56.5 73.5 Z" fill="url(#playGlow)"/>
</svg>
